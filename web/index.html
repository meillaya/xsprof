<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xsprof — read-only scheduler &amp; memory profiler</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="ui" aria-label="xsprof profiler UI"></canvas>
  <input id="file" type="file" accept=".ndjson,.jsonl,.json" hidden />
  <div id="lab-actions">
    <button id="scenario" type="button" disabled>run healthy scenario</button>
    <button id="scenario-file-button" type="button" disabled>scenario file</button>
    <button id="download" type="button" disabled>download result</button>
    <button id="trace" type="button" disabled>download trace</button>
    <button id="compare-file-button" type="button" disabled>compare journal</button>
    <button id="compare-clear" type="button" disabled>clear compare</button>
  </div>
  <input id="scenario-file" type="file" accept=".json" hidden />
  <input id="compare-file" type="file" accept=".ndjson,.jsonl,.json" hidden />
  <div id="status">loading…</div>
  <div id="error" hidden></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
