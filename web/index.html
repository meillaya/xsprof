<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>xsprof — read-only scheduler &amp; memory profiler</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a id="skip" href="#ui">skip to the console</a>
  <main id="console">
    <canvas id="ui" width="1440" height="900" aria-label="xsprof read-only scheduler and memory profiler console" aria-describedby="keyboard-help" tabindex="0"></canvas>
    <div id="boot-error" hidden role="alert"></div>
  </main>
  <input id="file" type="file" accept=".ndjson,.jsonl,.json" hidden />
  <div id="status" class="sr-only" role="status" aria-live="polite">loading…</div>
  <p id="keyboard-help" class="sr-only">Keyboard: 1 through 5 switch screens, slash filters, Space pauses live data, f toggles follow, question mark opens help, q quits. All actions have a pointer equivalent.</p>
  <script type="module" src="/main.js"></script>
</body>
</html>
