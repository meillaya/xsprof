name: release

# Linux-only, fail-closed release lane.
#
# * Publishing happens only for a pushed `vX.Y.Z` tag. Preflight refuses the run
#   unless the tag equals build.zig.zon, the runtime version, the CHANGELOG top
#   heading, and the README version, and unless the full `check-ci` gate passes.
# * `workflow_dispatch` is a dry run by construction: it builds and smoke-tests
#   the packages but can never run the publish job (see its `if:`), so it cannot
#   create a GitHub release. The input is informational only.
# * There is no macOS job, no code-signing keys or release credentials, no
#   package-manager tap publication, and no token-bearing clone URL: artifacts
#   are Linux tarballs, Debian packages, and AppImages, published with
#   SHA256SUMS plus a Sigstore build-provenance attestation.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dispatch runs are always dry runs (build + smoke, never publish)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/global
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

jobs:
  preflight:
    name: preflight (version lockstep + full CI)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version and fail closed
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          zon=$(sed -n 's/.*\.version = "\(.*\)".*/\1/p' build.zig.zon | head -1)
          case "$zon" in
            "" | *[!A-Za-z0-9._+-]*)
              echo "::error::build.zig.zon has an invalid version '$zon'"
              exit 1
              ;;
          esac
          if [ "$EVENT_NAME" = "push" ]; then
            case "$REF_NAME" in
              v*) tag=${REF_NAME#v} ;;
              *) echo "::error::release tag must look like vX.Y.Z: $REF_NAME"; exit 1 ;;
            esac
            if [ "$tag" != "$zon" ]; then
              echo "::error::tag v$tag does not match build.zig.zon version $zon"
              exit 1
            fi
            dry_run=false
            echo "release: tag v$tag matches manifest version $zon"
          else
            dry_run=true
            echo "::notice::workflow_dispatch is a dry run: no release will be published"
          fi
          sh qa/version_sync.sh
          {
            echo "version=$zon"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
      - name: Install display/media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils python3
      - name: Cache pinned Zig toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('tools/zig', 'tools/bootstrap.sh') }}
      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zig-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig', 'build.zig.zon', 'lib/xsui/build.zig.zon') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ runner.arch }}-
      - name: Bootstrap Zig 0.17.0
        run: sh tools/bootstrap.sh
      - name: Full CI gate (no silent SKIPs)
        env:
          XSPROF_REQUIRE_TOOLS: "1"
        run: ./tools/zig build check-ci --summary all 2>&1 | tee gate-check-ci.log
      - uses: actions/upload-artifact@v4
        with:
          name: gate-evidence
          path: gate-check-ci.log
          if-no-files-found: error

  linux:
    name: linux ${{ matrix.arch }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-linux-gnu
            deb_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-linux-gnu
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned Zig toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('tools/zig', 'tools/bootstrap.sh') }}
      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zig-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig', 'build.zig.zon', 'lib/xsui/build.zig.zon') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache pinned appimagetool
        uses: actions/cache@v4
        with:
          path: .tools/downloads/appimagetool-*
          key: ${{ runner.os }}-${{ runner.arch }}-appimagetool-1.9.1
      - name: Bootstrap Zig 0.17.0
        run: sh tools/bootstrap.sh
      - name: Package tarball, Debian package, and AppImage
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          XSPROF_TARGET: ${{ matrix.target }}
          XSPROF_OS: linux
          XSPROF_ARCH: ${{ matrix.arch }}
          XSPROF_DEB_ARCH: ${{ matrix.deb_arch }}
          XSPROF_APPIMAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          sh tools/package.sh
          sh tools/package_deb.sh
          sh tools/package_appimage.sh
          sh qa/appimage_smoke.sh \
            --appimage "dist/Xsprof-${VERSION}-${{ matrix.arch }}.AppImage" \
            --version "$VERSION"
      - name: Smoke package layouts
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -eu
          sh qa/package_layout.sh \
            --tarball "dist/xsprof-${VERSION}-linux-${{ matrix.arch }}.tar.gz" \
            --deb "dist/xsprof_${VERSION}-1_${{ matrix.deb_arch }}.deb" \
            --appimage "dist/Xsprof-${VERSION}-${{ matrix.arch }}.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: [preflight, linux]
    # Double fail-closed: only a tag push with a real (non-dry) preflight can
    # publish, and workflow_dispatch can never satisfy this condition.
    if: >-
      needs.preflight.outputs.dry_run == 'false' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: gate-evidence
          path: dist
      - name: Verify per-artifact checksums
        run: |
          set -eu
          cd dist
          found=0
          for file in *.sha256; do
            [ -f "$file" ] || continue
            sha256sum -c "$file"
            found=1
          done
          [ "$found" = 1 ] || { echo "::error::no per-artifact checksums found"; exit 1; }
      - name: Build aggregate SHA256SUMS
        run: |
          set -eu
          cd dist
          : > SHA256SUMS
          for file in *.tar.gz *.deb *.AppImage; do
            [ -f "$file" ] || continue
            sha256sum "$file" >> SHA256SUMS
          done
          [ -s SHA256SUMS ] || { echo "::error::no release artifacts found"; exit 1; }
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -eu
          cd dist
          files=(*.tar.gz *.deb *.AppImage *.sha256 SHA256SUMS gate-check-ci.log)
          gh release create "v${VERSION}" --verify-tag \
            --title "xsprof ${VERSION}" \
            --notes "Linux x86_64/aarch64 tarballs, Debian packages, and AppImages. The SHA256SUMS file lists every artifact; build provenance is attested with Sigstore (verify with: gh attestation verify <file> -R ${GITHUB_REPOSITORY}); gate-check-ci.log is the output of the release-blocking check-ci run that preceded these artifacts." \
            "${files[@]}"
