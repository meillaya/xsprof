name: microvm

# Manual-only disposable microvm.nix lane: the Nix-packaged xsprof binary is
# booted as a headless qemu guest and verified over the serial console
# (see qa/microvm_verify.sh). It is dispatch-only because it builds a NixOS
# guest closure and takes several minutes, so it must never burn minutes on
# push or schedule. Evidence lands in docs/evidence/microvm/ and is uploaded
# even when the gate fails.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Guest variant: auto (KVM when /dev/kvm is usable, else TCG), tcg (software emulation), kvm (needs /dev/kvm)"
        type: choice
        options:
          - auto
          - tcg
          - kvm
        default: tcg

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  microvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Boot and verify the Nix-packaged binary in a disposable microVM
        run: sh qa/microvm_verify.sh --variant "${{ inputs.variant }}"
      - name: Upload microVM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microvm-evidence-${{ inputs.variant }}
          path: docs/evidence/microvm/
          if-no-files-found: warn
